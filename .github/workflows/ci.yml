name: PostgreSQL data-quality checks
on: [push, pull_request]
jobs:
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dq_portfolio_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: dq_portfolio_demo
    steps:
      - uses: actions/checkout@v4
      - name: Run sample and assertions
        run: |
          for script in sql/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$script"
          done
